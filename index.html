<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
</head>
<body>

    <header>
        <h1>Cadastro de Usuário</h1>
        <nav>
            <ul>
                <li><a href="index.html">Página Principal</a></li>
                <li><a href="html/sobre.html">Sobre Mim</a></li>
                <li><a href="html/projetos.html">Meus Projetos</a></li>
                <li><a href="html/contatos.html">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section>
        <h2>Formulário de Cadastro</h2>
        
        <form action="#" method="POST">
            <label for="nome">Nome Completo:</label><br>
            <input type="text" id="nome" name="nome"><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email"><br><br>

            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha"><br><br>

            <label for="genero">Gênero:</label><br>
            <select id="genero" name="genero">
                <option value="masculino">Masculino</option>
                <option value="feminino">Feminino</option>
                <option value="outro">Outro</option>
                <option value="prefiro-nao-dizer">Prefiro não dizer</option>
            </select><br><br>

            <label>Interesses:</label><br>
            <input type="checkbox" id="int_java" name="interesse" value="java">
            <label for="int_java">Programação em Java</label><br>
            
            <input type="checkbox" id="int_matematica" name="interesse" value="matematica">
            <label for="int_matematica">Matemática</label><br>
            
            <input type="checkbox" id="int_xadrez" name="interesse" value="xadrez">
            <label for="int_xadrez">Xadrez</label><br><br>

            <label for="biografia">Biografia:</label><br>
            <textarea id="biografia" name="biografia" rows="4" cols="40"></textarea><br><br>

            <input type="submit" value="Enviar">
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Francisco Wilson</p>
    </footer>
</body>
</html>
